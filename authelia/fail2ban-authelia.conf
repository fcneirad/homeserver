[Definition]
# fail2ban filter for Authelia (reads the authelia.service journal).
#
# Failed password attempts (logrus text format):
#   time="..." level=error msg="Unsuccessful 1FA authentication attempt by user 'x'" error="..."
# Unknown usernames are logged too — this is what catches username spraying:
#   ... msg="Error occurred getting details for user with username input 'x' which usually indicates they do not exist"
# The failure id is the CLIENT IP (remote_ip=...), so the default nftables
# action bans the attacker's address. Authelia logs the real client IP here
# (Caddy passes it through X-Forwarded-For).
#
# NOTE: fail2ban >= 1.1 requires a failure-id group (fid/ip4/ip6/dns/mlfid)
# in every failregex line — without it the jail fails to start and the whole
# fail2ban server crashes (exit 255). <F-ID/> expands to (?P<fid>\S+).
failregex = ^.*msg="Unsuccessful (?:1FA|2FA) authentication attempt by user '[^']+'.*remote_ip=<F-ID/>
            ^.*msg="Error occurred getting details for user with username input '[^']*'.*remote_ip=<F-ID/>

ignoreregex =
